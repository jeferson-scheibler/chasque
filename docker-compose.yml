# Ambiente de desenvolvimento do Chasque.
# Portas presas a 127.0.0.1: nada fica exposto fora da VM.
services:
  db:
    image: postgis/postgis:16-3.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver --insecure 0.0.0.0:8000"
    volumes:
      - ./api:/app
      - ./dados:/dados
    ports:
      - "127.0.0.1:8010:8000"
    depends_on:
      db:
        condition: service_healthy

  # De hora em hora: lê as agendas ligadas, monta roteiros para os fins de semana livres e manda os avisos.
  agendador:
    build:
      context: ./api
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
    command: python manage.py planejar_fins_de_semana --repetir 60
    volumes:
      - ./api:/app
    depends_on:
      - api

  # A cada minuto: lê com a IA por que as pessoas salvaram os links da fila (salvos/intencoes.py).
  # Sem GEMINI_CHAVE, fica parado sem enviar nada.
  leitor:
    build:
      context: ./api
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
    command: python manage.py ler_intencoes --repetir 1
    volumes:
      - ./api:/app
    depends_on:
      - api

  app:
    build: ./app
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: http://api:8000
      MAPA_PROXY_TARGET: http://mapa:80
      APP_HOSTS: ${APP_HOSTS:-}
    volumes:
      - ./app:/app
      - app_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:5180:5173"
    depends_on:
      - api
      - mapa

  # Entrega o arquivo do mapa (dados/mapa/rs.pmtiles, gerado por scripts/gerar-mapa.sh).
  # O nginx atende pedidos parciais (Range), que é como o PMTiles lê só os pedaços que a tela precisa.
  mapa:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./dados/mapa:/usr/share/nginx/html/tiles:ro

volumes:
  db_data:
  app_node_modules:
