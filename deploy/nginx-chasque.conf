# Chasque no nginx da VM. Instalar:
#   sudo cp /chasque/deploy/nginx-chasque.conf /etc/nginx/sites-available/chasque
#   sudo ln -s /etc/nginx/sites-available/chasque /etc/nginx/sites-enabled/chasque
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d chasque.177-44-248-30.sslip.io
# O certbot acrescenta o bloco HTTPS e o redirecionamento de HTTP para HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name chasque.177-44-248-30.sslip.io;

    client_max_body_size 5m;

    location / {
        proxy_pass         http://127.0.0.1:5180;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # WebSocket do Vite (recarga automática em desenvolvimento)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 120s;
    }
}
